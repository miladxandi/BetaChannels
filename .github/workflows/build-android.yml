name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  KEYSTORE_PASSWORD: Milad&zandi&0937
  KEY_ALIAS: miladxandi
  KEY_PASSWORD: Milad&zandi&0937

jobs:
  build-freelancer:
    name: Build Freelancer Signed APK
    runs-on: Lithunia
    steps:
      - uses: actions/checkout@v4

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore NuGet Packages
        run: |
          dotnet restore BetaChannels.Freelancer/BetaChannels.Freelancer.csproj -p:TargetFramework=net10.0-android
          dotnet restore BetaChannels.Shared/BetaChannels.Shared.csproj

      - name: Source .bashrc
        run: source /home/github/.bashrc

      - name: Publish Release APK (Signed)
        run: |
          dotnet publish BetaChannels.Freelancer/BetaChannels.Freelancer.csproj \
            -p:TargetFramework=net10.0-android \
            -f net10.0-android \
            -c Release \
            --no-restore \
            /p:AndroidSdkDirectory=/var/github/android \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore=miladxandi.keystore \
            /p:AndroidSigningStorePass="${{ env.KEYSTORE_PASSWORD }}" \
            /p:AndroidSigningKeyAlias="${{ env.KEY_ALIAS }}" \
            /p:AndroidSigningKeyPass="${{ env.KEY_PASSWORD }}"

      - name: Find APK
        run: find BetaChannels.Freelancer/bin -name "*.apk" 2>/dev/null

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaChannels-Freelancer-Signed-APK
          path: BetaChannels.Freelancer/bin/Release/net10.0-android/**/*.apk

  build-employer:
    name: Build Employer Signed APK
    runs-on: Lithunia
    steps:
      - uses: actions/checkout@v4

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore NuGet Packages
        run: |
          dotnet restore BetaChannels.Employer/BetaChannels.Employer.csproj -p:TargetFramework=net10.0-android
          dotnet restore BetaChannels.Shared/BetaChannels.Shared.csproj

      - name: Source .bashrc
        run: source /home/github/.bashrc

      - name: Publish Release APK (Signed)
        run: |
          dotnet publish BetaChannels.Employer/BetaChannels.Employer.csproj \
            -p:TargetFramework=net10.0-android \
            -f net10.0-android \
            -c Release \
            --no-restore \
            /p:AndroidSdkDirectory=/var/github/android \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore=miladxandi.keystore \
            /p:AndroidSigningStorePass="${{ env.KEYSTORE_PASSWORD }}" \
            /p:AndroidSigningKeyAlias="${{ env.KEY_ALIAS }}" \
            /p:AndroidSigningKeyPass="${{ env.KEY_PASSWORD }}"

      - name: Find APK
        run: find BetaChannels.Employer/bin -name "*.apk" 2>/dev/null

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaChannels-Employer-Signed-APK
          path: BetaChannels.Employer/bin/Release/net10.0-android/**/*.apk

  release:
    name: Attach APKs to Release
    needs: [build-freelancer, build-employer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: Lithunia
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Freelancer APK
        uses: actions/download-artifact@v4
        with:
          name: BetaChannels-Freelancer-Signed-APK
          path: apks/freelancer

      - name: Download Employer APK
        uses: actions/download-artifact@v4
        with:
          name: BetaChannels-Employer-Signed-APK
          path: apks/employer

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/freelancer/*.apk
            apks/employer/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
