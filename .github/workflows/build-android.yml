name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-freelancer:
    name: Build Freelancer APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore NuGet Packages
        run: dotnet restore BetaChannels.Freelancer/BetaChannels.Freelancer.csproj

      - name: Build Debug APK
        run: dotnet build BetaChannels.Freelancer/BetaChannels.Freelancer.csproj -f net10.0-android -c Debug

      - name: Build Release APK
        run: dotnet build BetaChannels.Freelancer/BetaChannels.Freelancer.csproj -f net10.0-android -c Release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Freelancer-Debug-APK
          path: BetaChannels.Freelancer/bin/Debug/net10.0-android/*-Signed.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Freelancer-Release-APK
          path: BetaChannels.Freelancer/bin/Release/net10.0-android/*-Signed.apk

  build-employer:
    name: Build Employer APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore NuGet Packages
        run: dotnet restore BetaChannels.Employer/BetaChannels.Employer.csproj

      - name: Build Debug APK
        run: dotnet build BetaChannels.Employer/BetaChannels.Employer.csproj -f net10.0-android -c Debug

      - name: Build Release APK
        run: dotnet build BetaChannels.Employer/BetaChannels.Employer.csproj -f net10.0-android -c Release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Employer-Debug-APK
          path: BetaChannels.Employer/bin/Debug/net10.0-android/*-Signed.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Employer-Release-APK
          path: BetaChannels.Employer/bin/Release/net10.0-android/*-Signed.apk
