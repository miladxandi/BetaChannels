name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  KEYSTORE_PASSWORD: Milad&zandi&0937
  KEY_ALIAS: miladxandi
  KEY_PASSWORD: Milad&zandi&0937

jobs:
  build-freelancer:
    name: Build Freelancer Signed APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore NuGet Packages
        run: dotnet restore BetaChannels.Freelancer/BetaChannels.Freelancer.csproj

      - name: Build Release APK (Signed)
        run: dotnet build BetaChannels.Freelancer/BetaChannels.Freelancer.csproj -f net10.0-android -c Release /p:AndroidKeyStore=true /p:AndroidSigningKeyStore=miladxandi.keystore /p:AndroidSigningStorePass="${{ env.KEYSTORE_PASSWORD }}" /p:AndroidSigningKeyAlias="${{ env.KEY_ALIAS }}" /p:AndroidSigningKeyPass="${{ env.KEY_PASSWORD }}"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaChannels-Freelancer-Signed-APK
          path: BetaChannels.Freelancer/bin/Release/net10.0-android/*-Signed.apk

  build-employer:
    name: Build Employer Signed APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore NuGet Packages
        run: dotnet restore BetaChannels.Employer/BetaChannels.Employer.csproj

      - name: Build Release APK (Signed)
        run: dotnet build BetaChannels.Employer/BetaChannels.Employer.csproj -f net10.0-android -c Release /p:AndroidKeyStore=true /p:AndroidSigningKeyStore=miladxandi.keystore /p:AndroidSigningStorePass="${{ env.KEYSTORE_PASSWORD }}" /p:AndroidSigningKeyAlias="${{ env.KEY_ALIAS }}" /p:AndroidSigningKeyPass="${{ env.KEY_PASSWORD }}"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaChannels-Employer-Signed-APK
          path: BetaChannels.Employer/bin/Release/net10.0-android/*-Signed.apk

  release:
    name: Attach APKs to Release
    needs: [build-freelancer, build-employer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Freelancer APK
        uses: actions/download-artifact@v4
        with:
          name: BetaChannels-Freelancer-Signed-APK
          path: apks/freelancer

      - name: Download Employer APK
        uses: actions/download-artifact@v4
        with:
          name: BetaChannels-Employer-Signed-APK
          path: apks/employer

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/freelancer/*.apk
            apks/employer/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
